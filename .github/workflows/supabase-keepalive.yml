name: Supabase Keepalive

on:
  schedule:
    # Four small external database reads per day, deliberately off the top of the hour.
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-keepalive.yml"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query Supabase through the public REST API
        env:
          SUPABASE_URL: https://tzxlrglgwzinefutledx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_s54v4rmFk_BjHoweE7mliA_w64vK6WR
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --ipv4 --http1.1 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/app_feedback?select=id&limit=1")"
          printf '%s\n' "$response"
          printf 'Supabase keepalive succeeded at %s UTC\n' "$(date -u +'%Y-%m-%d %H:%M:%S')"

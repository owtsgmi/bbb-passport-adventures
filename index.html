<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBB Passport Adventures</title>
<style>
:root{--bg:#08121e;--panel:#0e1d2c;--panel2:#13283d;--ink:#eef6ff;--muted:#9fb4c8;--blue:#4fc3f7;--gold:#ffd166;--green:#5fd39b;--red:#ef6b73;--line:#243c54}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111c,#0b1827);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:10;background:#08121ef2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 4vw}
.headrow{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.brand h1{margin:0;font-size:25px}.sub,.meta,.small{color:var(--muted)}
.scorecard{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:8px;min-width:390px}.score{background:#102439;border:1px solid #2c4963;border-radius:12px;padding:9px 11px;text-align:center}.score b{display:block;font-size:18px}.score span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.controls,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls{margin-top:10px}.filters{margin-top:8px}
button,input,select{border:1px solid #2b4964;border-radius:10px;background:#102439;color:var(--ink);padding:9px 11px}button{cursor:pointer}.primary{background:#137aa8;border-color:#4fc3f7;font-weight:700}
main{max-width:1120px;margin:auto;padding:20px 4vw 60px}.section{margin:18px 0}.section h2{font-size:18px;margin:0 0 10px}.light{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:0}.yellow{background:var(--gold);box-shadow:0 0 10px #ffd16688}.green{background:var(--green);box-shadow:0 0 8px #5fd39b55}.red{background:var(--red);box-shadow:0 0 8px #ef6b7355}
.pinned{background:linear-gradient(135deg,#18281e,#1b2637);border:1px solid #7c6730;border-radius:16px;overflow:hidden;margin-bottom:20px}.pinned .advhead{padding:17px 18px}.pinempty{padding:18px;color:var(--muted);background:var(--panel);border:1px dashed #34516a;border-radius:14px}
.advhead{display:flex;justify-content:space-between;gap:12px}.advhead h3{margin:0 0 5px;font-size:19px}.badge{font-size:12px;font-weight:800;background:#4a3d16;color:#ffe18a;padding:4px 8px;border-radius:999px;margin-left:7px}
.route{padding:0 17px 17px;display:grid;gap:8px}.stop{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:10px}.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#1a3a56;color:var(--blue);font-weight:800}.name{font-weight:700}.detail{color:var(--muted);font-size:13px;margin-top:3px}.sl{text-decoration:none;background:#12668f;color:white;padding:8px 10px;border-radius:8px;font-weight:700}.next{box-shadow:0 0 0 2px #ffd16666}.urgent{color:var(--gold);font-weight:800}
.progress{height:7px;background:#172c3f;border-radius:999px;overflow:hidden;margin-top:8px;max-width:430px}.bar{height:100%;background:#50c89c}
details.trip{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}details.trip[open]{border-color:#365873}summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}summary::-webkit-details-marker{display:none}.summary-main{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.summary-main strong{font-size:15px}.summary-right{color:var(--muted);font-size:13px;white-space:nowrap}.tripbody{border-top:1px solid var(--line);padding:12px 14px 14px}.completed-row{opacity:.67}
#toast{display:none;position:fixed;right:18px;bottom:18px;z-index:50;background:#10243a;border:1px solid var(--blue);border-radius:10px;padding:12px 15px;max-width:480px}
@media(max-width:780px){.headrow{display:block}.scorecard{min-width:0;margin-top:10px;grid-template-columns:repeat(3,1fr)}.score b{font-size:15px}.advhead{display:block}.stop{grid-template-columns:30px 1fr}.actions{grid-column:2}.summary-right{display:none}}
</style></head>
<body>
<header>
<div class="headrow">
  <div class="brand"><h1>🛂 BBB Passport Adventures</h1><div class="sub">Shared Second Life exploration board</div></div>
  <div class="scorecard" id="scorecard"></div>
</div>
<div class="controls">
  <select id="explorer"><option value="me">🧭 My passport</option><option value="partner">❤️ Partner's passport</option></select>
  <button class="primary" onclick="surpriseUs()">🎲 Pick an adventure</button>
  <button onclick="jumpPinned()">📌 Pinned adventure</button>
</div>
<div class="filters">
  <input id="q" placeholder="Search place or region…">
  <select id="zone"><option value="">All areas</option></select>
</div>
</header>

<div id="toast"></div>
<main>
<section class="section">
  <h2><span class="light yellow"></span>Pinned Adventure</h2>
  <div id="pinned"></div>
</section>

<section class="section">
  <h2><span class="light green"></span>Pending Adventures</h2>
  <div class="small" style="margin-bottom:9px">Click any adventure to expand it.</div>
  <div id="pending"></div>
</section>

<section class="section">
  <h2><span class="light red"></span>Completed Adventures</h2>
  <div id="completed"></div>
</section>

<p class="small">Shared board: owtsgmi.github.io/bbb-passport-adventures</p>
</main>

<script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script src="data5.js"></script><script src="data6.js"></script><script src="data7.js"></script>
<script>
const SITE_URL='https://owtsgmi.github.io/bbb-passport-adventures/';
const adventures=(window.RAW||[]).map(a=>({id:a[0],title:a[1],zone:a[2],mode:a[3],minutes:a[4],stamps:a[5].map(s=>({id:s[0],name:s[1],url:s[2],region:s[3],x:s[4],y:s[5],z:s[6],retire:s[7]}))}));
const allStampIds=[...new Set(adventures.flatMap(a=>a.stamps.map(s=>s.id)))];
let explorer=localStorage.getItem('bbb-explorer')||'me';
let started=new Set(JSON.parse(localStorage.getItem('bbb-started')||'[]').map(Number));
let lastAdventure=Number(localStorage.getItem('bbb-last-adventure')||0);
const doneKey=p=>`bbb-done-${p}`;
let meDone=new Set(JSON.parse(localStorage.getItem(doneKey('me'))||'[]').map(Number));
let partnerDone=new Set(JSON.parse(localStorage.getItem(doneKey('partner'))||'[]').map(Number));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function currentDone(){return explorer==='me'?meDone:partnerDone}
function saveAll(){localStorage.setItem(doneKey('me'),JSON.stringify([...meDone]));localStorage.setItem(doneKey('partner'),JSON.stringify([...partnerDone]));localStorage.setItem('bbb-started',JSON.stringify([...started]));render()}
function toast(m){const n=$('#toast');n.textContent=m;n.style.display='block';setTimeout(()=>n.style.display='none',2400)}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('Copied — paste into SL chat')).catch(()=>prompt('Copy this into SL chat:',t))}
function startedAdventure(a){return started.has(a.id)||a.stamps.some(s=>meDone.has(s.id)||partnerDone.has(s.id))}
function personComplete(a,set){return a.stamps.every(s=>set.has(s.id))}
function togetherComplete(a){return personComplete(a,meDone)&&personComplete(a,partnerDone)}
function progressFor(a,set){return a.stamps.filter(s=>set.has(s.id)).length}
function startAdventure(id){started.add(id);lastAdventure=id;localStorage.setItem('bbb-last-adventure',id);saveAll();setTimeout(jumpPinned,40)}
function toggleStamp(id,advId){const d=currentDone();d.has(id)?d.delete(id):d.add(id);started.add(advId);lastAdventure=advId;localStorage.setItem('bbb-last-adventure',advId);saveAll()}
function sw(){explorer=$('#explorer').value;localStorage.setItem('bbb-explorer',explorer);render()}
function surpriseUs(){const pool=adventures.filter(a=>!startedAdventure(a)&&!togetherComplete(a));if(!pool.length)return toast('No untouched adventures left.');const a=pool[Math.floor(Math.random()*pool.length)];startAdventure(a.id);toast('Pinned: '+a.title)}
function jumpPinned(){document.getElementById('pinned')?.scrollIntoView({behavior:'smooth',block:'start'})}
function meetHere(a,i){const s=a.stamps[i];copy(`Meet me at ${s.name} — Stop ${i+1} of ${a.stamps.length} on ${a.title}. Region: ${s.region} (${s.x}, ${s.y}, ${s.z}). ${SITE_URL}#trip-${a.id}-stop-${i+1}`)}
function shareTrip(a){copy(`Let's do ${a.title}: about ${a.minutes} minutes, ${a.stamps.length} stops, best by ${a.mode}. ${SITE_URL}#trip-${a.id}`)}
function routeHtml(a){
 const d=currentDone(),mine=progressFor(a,d),both=Math.min(progressFor(a,meDone),progressFor(a,partnerDone));
 let next=a.stamps.findIndex(s=>!d.has(s.id)); if(next<0) next=0;
 let h=`<div class="advhead"><div><h3>${esc(a.title)} <span class="badge">IN PROGRESS</span></h3><div class="meta">📍 ${esc(a.zone)} • ⏱ about ${a.minutes} min • ${esc(a.mode)} • ${a.stamps.length} stops</div><div class="progress"><div class="bar" style="width:${Math.round((mine/a.stamps.length)*100)}%"></div></div><div class="small">${explorer==='me'?'My':'Partner'} passport: ${mine}/${a.stamps.length} • Both passports at ${both}/${a.stamps.length}</div><div class="actions" style="margin-top:9px"><button onclick='shareTrip(adventures.find(x=>x.id===${a.id}))'>💬 Share plan</button></div></div></div><div class="route">`;
 a.stamps.forEach((s,i)=>{const checked=d.has(s.id),isNext=!checked&&i===next;h+=`<div id="trip-${a.id}-stop-${i+1}" class="stop ${isNext?'next':''}"><div class="num">${i+1}</div><div><div class="name">${esc(s.name)} ${isNext?'<span class="urgent">← NEXT</span>':''}</div><div class="detail">${esc(s.region)} • ${s.x}, ${s.y}, ${s.z}${s.retire?' • retires '+esc(s.retire):''}</div></div><div class="actions"><button onclick='meetHere(adventures.find(x=>x.id===${a.id}),${i})'>💬 Meet here</button><a class="sl" href="${esc(s.url)}">Open in SL</a><label><input type="checkbox" ${checked?'checked':''} onchange="toggleStamp(${s.id},${a.id})"> Done</label></div></div>`});
 return h+'</div>';
}
function collapsedTrip(a,completed=false){
 const mine=progressFor(a,currentDone());
 return `<details class="trip ${completed?'completed-row':''}"><summary><div class="summary-main"><span class="light ${completed?'red':'green'}"></span><strong>${esc(a.title)}</strong> <span class="small">— ${esc(a.zone)}</span></div><div class="summary-right">${a.stamps.length} stops • ~${a.minutes} min • ${mine}/${a.stamps.length}</div></summary><div class="tripbody"><div class="meta">Best by ${esc(a.mode)}.</div><div class="actions" style="margin-top:9px"><button class="primary" onclick="startAdventure(${a.id})">${completed?'Re-open adventure':'📌 Pin & start'}</button><button onclick='shareTrip(adventures.find(x=>x.id===${a.id}))'>💬 Share plan</button></div></div></details>`;
}
function render(){
 const q=$('#q').value.toLowerCase(),z=$('#zone').value;
 const matches=a=>(!z||a.zone===z)&&(!q||[a.title,a.zone,a.mode,...a.stamps.flatMap(s=>[s.name,s.region])].join(' ').toLowerCase().includes(q));
 let pinned=adventures.find(a=>a.id===lastAdventure&&!togetherComplete(a));
 if(!pinned) pinned=adventures.find(a=>startedAdventure(a)&&!togetherComplete(a));
 if(pinned && lastAdventure!==pinned.id){lastAdventure=pinned.id;localStorage.setItem('bbb-last-adventure',pinned.id)}
 $('#pinned').innerHTML=pinned?'<div class="pinned" id="pinned-card">'+routeHtml(pinned)+'</div>':'<div class="pinempty">No adventure in progress. Pick one below or hit <b>Pick an adventure</b>.</div>';
 const pending=adventures.filter(a=>!togetherComplete(a)&&(!pinned||a.id!==pinned.id)&&matches(a)).sort((a,b)=>a.zone.localeCompare(b.zone)||a.title.localeCompare(b.title));
 $('#pending').innerHTML=pending.map(a=>collapsedTrip(a,false)).join('')||'<div class="pinempty">No pending adventures match this filter.</div>';
 const completed=adventures.filter(a=>togetherComplete(a)&&matches(a)).sort((a,b)=>a.zone.localeCompare(b.zone)||a.title.localeCompare(b.title));
 $('#completed').innerHTML=completed.map(a=>collapsedTrip(a,true)).join('')||'<div class="pinempty">No completed adventures yet.</div>';
 const completedAdventures=adventures.filter(togetherComplete).length;
 $('#scorecard').innerHTML=`<div class="score"><b>${completedAdventures}/${adventures.length}</b><span>Adventures</span></div><div class="score"><b>${meDone.size}/${allStampIds.length}</b><span>My passport</span></div><div class="score"><b>${partnerDone.size}/${allStampIds.length}</b><span>Partner passport</span></div>`;
}
function init(){
 $('#explorer').value=explorer;$('#explorer').addEventListener('change',sw);
 [...new Set(adventures.map(a=>a.zone))].sort().forEach(z=>$('#zone').insertAdjacentHTML('beforeend',`<option>${esc(z)}</option>`));
 ['q','zone'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));
 const m=location.hash.match(/trip-(\d+)(?:-stop-(\d+))?/); if(m){lastAdventure=Number(m[1]);started.add(lastAdventure);localStorage.setItem('bbb-last-adventure',lastAdventure);localStorage.setItem('bbb-started',JSON.stringify([...started]))}
 render();
 if(m)setTimeout(()=>document.getElementById(m[2]?`trip-${m[1]}-stop-${m[2]}`:'pinned-card')?.scrollIntoView({behavior:'smooth',block:'center'}),120);
}
init();
</script>
</body></html>

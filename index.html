<script>
const SITE_URL='https://owtsgmi.github.io/bbb-passport-adventures/';
const ASSET_API='https://tzxlrglgwzinefutledx.supabase.co/functions/v1/bbb-stamp-assets';
const stampImages=new Map();
function normStopName(s){return String(s||'').toLowerCase().replace(/\b(be|na|ca|st|sl|he|sa|ga|zi)\b/g,' ').replace(/[^a-z0-9]+/g,' ').trim()}
function proxyStampImage(u){
 try{
   const x=new URL(u);
   if(x.protocol==='https:'&&x.hostname.toLowerCase()==='picture-service.secondlife.com')return u;
 }catch(e){}
 return ASSET_API+'?mode=image&src='+encodeURIComponent(u)
}
function sameStopLocation(s,it){return String(s.region||'').toLowerCase()===String(it.region||'').toLowerCase()&&Number(s.x)===Number(it.x)&&Number(s.y)===Number(it.y)&&Number(s.z)===Number(it.z)}
function stampThumbHtml(s){
 const u=stampImages.get(Number(s.id));
 if(!u)return '<div class="adventurethumb placeholder">📍</div>';
 return '<div><img class="adventurethumb" loading="lazy" src="'+esc(proxyStampImage(u))+'" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><div class="adventurethumb placeholder" style="display:none">📍</div></div>';
}
async function loadAdventureStopImages(){
 try{
   const r=await fetch(ASSET_API,{cache:'no-store'});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const data=await r.json();
   if(!data?.ok||!Array.isArray(data.items))throw new Error('bad BBB response');
   const allStops=adventures.flatMap(a=>a.stamps);
   data.items.forEach(it=>{
     if(!it?.img)return;
     let match=allStops.find(s=>sameStopLocation(s,it));
     if(!match){
       const nk=normStopName(it.name);
       if(nk)match=allStops.find(s=>normStopName(s.name)===nk);
     }
     if(match)stampImages.set(Number(match.id),it.img);
   });
   try{localStorage.setItem('bbb-adventure-image-cache',JSON.stringify({saved_at:Date.now(),items:data.items}))}catch(e){}
   render();
 }catch(e){
   try{
     const cached=JSON.parse(localStorage.getItem('bbb-adventure-image-cache')||'null');
     if(cached?.items){
       const allStops=adventures.flatMap(a=>a.stamps);
       cached.items.forEach(it=>{
         if(!it?.img)return;
         let match=allStops.find(s=>sameStopLocation(s,it));
         if(!match){
           const nk=normStopName(it.name);
           if(nk)match=allStops.find(s=>normStopName(s.name)===nk);
         }
         if(match)stampImages.set(Number(match.id),it.img);
       });
       render();
     }
   }catch(_){}
 }
}
const adventures=(window.RAW||[]).map(a=>({id:a[0],title:a[1],zone:a[2],mode:a[3],minutes:a[4],stamps:a[5].map(s=>({id:s[0],name:s[1],url:s[2],region:s[3],x:s[4],y:s[5],z:s[6],retire:s[7]}))}));
const allStampIds=[...new Set(adventures.flatMap(a=>a.stamps.map(s=>s.id)))];
const TOTAL_PASSPORT_STAMPS=allStampIds.length+1; // 381 campaign stamps + 1 already collected before the campaign list
const PRE_CAMPAIGN_BASELINE={partner:1,me:0};
function knownPreCampaignStamps(view){return Number(PRE_CAMPAIGN_BASELINE[view]||0)}
let started=new Set(JSON.parse(localStorage.getItem('bbb-started')||'[]').map(Number));
let lastAdventure=Number(localStorage.getItem('bbb-last-adventure')||0);
let adventureLocked=localStorage.getItem('bbb-adventure-locked')!=='false';
let adventureTreasureEnabled=false;
let meDone=new Set(JSON.parse(localStorage.getItem('bbb-done-me')||'[]').map(Number));
let partnerDone=new Set(JSON.parse(localStorage.getItem('bbb-done-partner')||'[]').map(Number));
let meSpent=Number(localStorage.getItem('bbb-me-spent')||0);
let partnerSpent=Number(localStorage.getItem('bbb-partner-spent')||0);
let rewardLog=JSON.parse(localStorage.getItem('bbb-reward-log')||'[]');
let unicornRedeemed=Number(localStorage.getItem('bbb-unicorn-redeemed')||0);
let payoutLog=JSON.parse(localStorage.getItem('bbb-payout-log')||'[]');
let adventureRewards=JSON.parse(localStorage.getItem('bbb-adventure-rewards')||'{}');
let tabPartnerName=localStorage.getItem('bbb-tab-partner-name')||'AA';
let tabMeName=localStorage.getItem('bbb-tab-me-name')||'KK';
let partnerStaFiUrl=localStorage.getItem('bbb-partner-stafi-url')||'';
let meStaFiUrl=localStorage.getItem('bbb-me-stafi-url')||'';
let defaultView=localStorage.getItem('bbb-default-view')||'partner';
let familyKey=localStorage.getItem('bbb-family-key')||sessionStorage.getItem('bbb-family-key')||'';
let privateSettingsUpdated='';

function bytesToB64(bytes){let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function b64ToBytes(s){const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
async function derivePrivateKey(secret,salt){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptPrivatePayload(payload,secret){
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const key=await derivePrivateKey(secret,salt);
 const plain=new TextEncoder().encode(JSON.stringify(payload));
 const enc=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));
 return {ciphertext:bytesToB64(enc),salt:bytesToB64(salt),iv:bytesToB64(iv)};
}
async function decryptPrivatePayload(row,secret){
 const salt=b64ToBytes(row.salt),iv=b64ToBytes(row.iv),data=b64ToBytes(row.ciphertext);
 const key=await derivePrivateKey(secret,salt);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
 return JSON.parse(new TextDecoder().decode(plain));
}
async function writePrivateSettings(){
 const payload={partnerStaFiUrl,meStaFiUrl};
 const enc=await encryptPrivatePayload(payload,familyKey);
 const r=await fetch(SUPA_URL+'/rest/v1/bbb_private_settings?id=eq.1',{method:'PATCH',headers:{apikey:SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({...enc,version:1,updated_at:new Date().toISOString()})});
 if(!r.ok)throw new Error('Private settings write '+r.status);
 const rows=await r.json();privateSettingsUpdated=rows[0]?.updated_at||'';
}
async function readPrivateSettings(){
 const r=await fetch(SUPA_URL+'/rest/v1/bbb_private_settings?id=eq.1&select=*',{headers:{apikey:SUPA_KEY}});
 if(!r.ok)throw new Error('Private settings read '+r.status);
 const rows=await r.json();return rows[0];
}
function applyPrivateSettings(p){

}
async function unlockPrivateSettings(){
 familyKey=$('#set-family-key')?.value||familyKey;
 if(familyKey.length<8){toast('Enter your Secret Club Code first.');return}
 try{const row=await readPrivateSettings();if(!row?.ciphertext){toast('No encrypted cloud settings saved yet.');return}const p=await decryptPrivatePayload(row,familyKey);applyPrivateSettings(p);privateSettingsUpdated=row.updated_at||'';if($('#set-remember-key')?.checked)localStorage.setItem('bbb-family-key',familyKey);else sessionStorage.setItem('bbb-family-key',familyKey);loadSettingsForm();render();toast('Private settings unlocked 🔓')}catch(e){toast('Could not unlock — check the Secret Club Code')}
}
async function autoLoadPrivateSettings(){
 if(!familyKey)return;
 try{
   const row=await readPrivateSettings();
   if(row?.ciphertext){
     const p=await decryptPrivatePayload(row,familyKey);
     applyPrivateSettings(p);
     privateSettingsUpdated=row.updated_at||'';
     render();
     if(typeof writeSharedDisplaySettings==='function')writeSharedDisplaySettings().catch(()=>{});
   }
 }catch(e){}
}
async function pollPrivateSettings(){
 if(!familyKey)return;
 try{
   const row=await readPrivateSettings();
   if(!row?.ciphertext||!row.updated_at||row.updated_at===privateSettingsUpdated)return;
   const p=await decryptPrivatePayload(row,familyKey);
   applyPrivateSettings(p);
   privateSettingsUpdated=row.updated_at;
   if(document.getElementById('settings-page')?.classList.contains('open'))loadSettingsForm();
   render();
 }catch(e){}
}

function randomLindenReward(){const a=new Uint32Array(1);crypto.getRandomValues(a);return 20+(a[0]%81)}
function ensureAdventureRewards(){
 let changed=false;
 adventures.forEach(a=>{
   if(togetherComplete(a)&&!adventureRewards[a.id]){
     adventureRewards[a.id]={linden:randomLindenReward(),at:new Date().toISOString()};
     changed=true;
   }
 });
 if(changed)localStorage.setItem('bbb-adventure-rewards',JSON.stringify(adventureRewards));
 return changed;
}

function syncCompletedRewardsToPayouts(){
 let changed=ensureAdventureRewards();
 const used=new Set(payoutLog.map(r=>Number(r.adventure_id||0)).filter(Boolean));
 const completed=adventures.filter(a=>togetherComplete(a)&&adventureRewards[a.id]&&!used.has(a.id))
   .sort((a,b)=>String(adventureRewards[a.id]?.at||'').localeCompare(String(adventureRewards[b.id]?.at||''))||a.id-b.id);
 const legacyRedemptions=Math.max(0,Math.floor(Number(unicornRedeemed||0)/500)-used.size);
 completed.slice(legacyRedemptions).forEach(a=>{
   payoutLog.push({linden:rewardFor(a),adventure_id:a.id,title:a.title,paid:false,auto:true,at:adventureRewards[a.id].at||new Date().toISOString()});
   changed=true;
 });
 if(changed){
   payoutLog.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
   payoutLog=payoutLog.slice(0,60);
   localStorage.setItem('bbb-payout-log',JSON.stringify(payoutLog));
 }
 return changed;
}
